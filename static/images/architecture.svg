<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="20" y="20" width="920" height="50" rx="8" fill="url(#headerGrad)"/>
  <text x="480" y="52" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
    DrainSight AI – System Architecture &amp; Data Pipeline
  </text>

  <!-- Module 1: Input & Preprocessing -->
  <g transform="translate(30, 95)" filter="url(#cardShadow)">
    <rect width="165" height="240" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <rect width="165" height="38" rx="10" fill="#e0f2fe"/>
    <text x="82" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">1. Input &amp; Preprocess</text>
    <circle cx="82" cy="72" r="22" fill="#0284c7"/>
    <text x="82" y="78" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle">📷</text>
    <text x="82" y="115" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Images &amp; Videos</text>
    <path d="M 20 130 L 145 130" stroke="#e2e8f0"/>
    <text x="20" y="150" font-family="sans-serif" font-size="11" fill="#475569">• JPG, PNG, MP4</text>
    <text x="20" y="170" font-family="sans-serif" font-size="11" fill="#475569">• Bilateral Filter</text>
    <text x="20" y="190" font-family="sans-serif" font-size="11" fill="#475569">• CLAHE Lighting</text>
    <text x="20" y="210" font-family="sans-serif" font-size="11" fill="#475569">• 640x640 Resizing</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 202 215 L 222 215" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="220,210 230,215 220,220" fill="#0284c7"/>

  <!-- Module 2: YOLOv8 AI Detection -->
  <g transform="translate(235, 95)" filter="url(#cardShadow)">
    <rect width="185" height="240" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <rect width="185" height="38" rx="10" fill="#f5f3ff"/>
    <text x="92" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9" text-anchor="middle">2. YOLOv8 Detection</text>
    <circle cx="92" cy="72" r="22" fill="#7c3aed"/>
    <text x="92" y="78" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle">🧠</text>
    <text x="92" y="115" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Deep Neural Net</text>
    <path d="M 20 130 L 165 130" stroke="#e2e8f0"/>
    <text x="20" y="150" font-family="sans-serif" font-size="11" fill="#475569">• drain_opening</text>
    <text x="20" y="170" font-family="sans-serif" font-size="11" fill="#475569">• plastic_waste</text>
    <text x="20" y="190" font-family="sans-serif" font-size="11" fill="#475569">• leaves &amp; organic</text>
    <text x="20" y="210" font-family="sans-serif" font-size="11" fill="#475569">• paper &amp; mud</text>
    <text x="20" y="226" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7c3aed">• Conf: &gt;= 0.35</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="427,210 437,215 427,220" fill="#6d28d9"/>

  <!-- Module 3: Blockage Assessment -->
  <g transform="translate(442, 95)" filter="url(#cardShadow)">
    <rect width="195" height="240" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
    <rect width="195" height="38" rx="10" fill="#fff7ed"/>
    <text x="97" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">3. Blockage Assessment</text>
    <circle cx="97" cy="72" r="22" fill="#ea580c"/>
    <text x="97" y="78" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle">📐</text>
    <text x="97" y="115" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Geometric IoU Overlap</text>
    <path d="M 20 130 L 175 130" stroke="#e2e8f0"/>
    <text x="20" y="150" font-family="sans-serif" font-size="11" fill="#475569">• Overlap Area / Drain</text>
    <text x="20" y="170" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">• 0–20%: Clear</text>
    <text x="20" y="190" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d97706">• 21–60%: Partial</text>
    <text x="20" y="210" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">• &gt;60%: Heavy Block</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="644,210 654,215 644,220" fill="#c2410c"/>

  <!-- Module 4: Dashboard & Telemetry -->
  <g transform="translate(659, 95)" filter="url(#cardShadow)">
    <rect width="270" height="240" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect width="270" height="38" rx="10" fill="#f0fdf4"/>
    <text x="135" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">4. Results &amp; Dashboard</text>
    <circle cx="135" cy="72" r="22" fill="#16a34a"/>
    <text x="135" y="78" font-family="sans-serif" font-size="18" fill="#fff" text-anchor="middle">📊</text>
    <text x="135" y="115" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Early Warning System</text>
    <path d="M 20 130 L 250 130" stroke="#e2e8f0"/>
    <text x="20" y="150" font-family="sans-serif" font-size="11" fill="#475569">• Annotated Output Media</text>
    <text x="20" y="170" font-family="sans-serif" font-size="11" fill="#475569">• Persistent SQLite History</text>
    <text x="20" y="190" font-family="sans-serif" font-size="11" fill="#475569">• Interactive Chart.js Graphs</text>
    <text x="20" y="210" font-family="sans-serif" font-size="11" fill="#475569">• One-click CSV Reports</text>
  </g>

  <!-- Bottom Technology Stack Ribbon -->
  <g transform="translate(30, 355)">
    <rect width="900" height="100" rx="8" fill="#0f172a"/>
    <text x="450" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">UNDERLYING ZERO-COST OPEN-SOURCE TECHNOLOGY STACK</text>
    <g transform="translate(40, 50)">
      <rect width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Python / Flask</text>
    </g>
    <g transform="translate(210, 50)">
      <rect width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">OpenCV Engine</text>
    </g>
    <g transform="translate(380, 50)">
      <rect width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Ultralytics YOLOv8</text>
    </g>
    <g transform="translate(550, 50)">
      <rect width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">SQLite Database</text>
    </g>
    <g transform="translate(720, 50)">
      <rect width="140" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="23" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">Bootstrap 5 + Chart.js</text>
    </g>
  </g>
</svg>
