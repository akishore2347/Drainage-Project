<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="aiRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="700" height="450" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Scanning Grid -->
  <g opacity="0.15">
    <path d="M 50 0 L 50 450 M 150 0 L 150 450 M 250 0 L 250 450 M 350 0 L 350 450 M 450 0 L 450 450 M 550 0 L 550 450 M 650 0 L 650 450" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 0 50 L 700 50 M 0 150 L 700 150 M 0 250 L 700 250 M 0 350 L 700 350" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Pavement / Road Curb -->
  <polygon points="50,230 650,230 670,410 30,410" fill="#334155" stroke="#475569" stroke-width="3"/>
  
  <!-- Drain Opening (Culvert / Grate Chamber) -->
  <polygon points="180,260 520,260 550,380 150,380" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
  
  <!-- Flowing Water in Drain -->
  <path d="M 170 340 Q 350 330 530 340 L 545 375 L 155 375 Z" fill="url(#waterGrad)"/>
  
  <!-- Drain Iron Grates -->
  <line x1="225" y1="262" x2="205" y2="378" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="285" y1="262" x2="275" y2="378" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="350" y1="262" x2="350" y2="378" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="415" y1="262" x2="425" y2="378" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="475" y1="262" x2="495" y2="378" stroke="#475569" stroke-width="7" stroke-linecap="round"/>

  <!-- Drain Rim Highlight -->
  <polygon points="175,255 525,255 520,265 180,265" fill="#94a3b8"/>

  <!-- AI Camera Ray from Top -->
  <polygon points="350,50 140,400 560,400" fill="url(#aiRay)"/>
  
  <!-- Detection Bounding Box 1: Drain Opening -->
  <rect x="140" y="245" width="420" height="145" rx="4" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6,4" filter="url(#glow)"/>
  <rect x="140" y="222" width="130" height="23" rx="3" fill="#0284c7"/>
  <text x="146" y="238" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">drain_opening 0.94</text>

  <!-- Debris: Plastic Bottles & Bags -->
  <!-- Plastic Bottle -->
  <rect x="230" y="310" width="55" height="28" rx="6" fill="#38bdf8" transform="rotate(-15 250 320)" opacity="0.9"/>
  <!-- Bounding Box for Plastic -->
  <rect x="215" y="295" width="75" height="55" rx="3" fill="none" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>
  <rect x="215" y="277" width="105" height="18" rx="2" fill="#ef4444"/>
  <text x="219" y="290" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">plastic_waste 0.91</text>

  <!-- Debris: Leaves & Twigs -->
  <ellipse cx="430" cy="325" rx="28" ry="16" fill="#16a34a" transform="rotate(25 430 325)"/>
  <ellipse cx="445" cy="335" rx="20" ry="12" fill="#65a30d" transform="rotate(-15 445 335)"/>
  <!-- Bounding Box for Leaves -->
  <rect x="395" y="305" width="85" height="50" rx="3" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <rect x="395" y="289" width="70" height="16" rx="2" fill="#22c55e"/>
  <text x="399" y="301" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">leaves 0.88</text>

  <!-- AI Inspection Drone / Camera Icon at Top -->
  <circle cx="350" cy="50" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  <circle cx="350" cy="50" r="14" fill="#0284c7"/>
  <circle cx="350" cy="50" r="6" fill="#ffffff"/>
  <circle cx="353" cy="47" r="2" fill="#38bdf8"/>

  <!-- Pulse Rings -->
  <circle cx="350" cy="50" r="38" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- Floating Telemetry Badges -->
  <!-- Blockage Meter Badge -->
  <g transform="translate(480, 70)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#fef3c7"/>
    <text x="22" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#d97706">!</text>
    <text x="52" y="25" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">BLOCKAGE LEVEL</text>
    <text x="52" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">38% (Partial)</text>
  </g>

  <!-- Sensorless Vision Badge -->
  <g transform="translate(40, 70)">
    <rect width="180" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#dcfce7"/>
    <text x="20" y="36" font-family="sans-serif" font-size="16" fill="#16a34a">✓</text>
    <text x="52" y="25" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">CV DETECTION</text>
    <text x="52" y="45" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981">Sensorless AI</text>
  </g>
</svg>
